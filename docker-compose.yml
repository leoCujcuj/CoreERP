name: coreerp

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: coreerp-sqlserver
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-Password123*!}
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD:-Password123*!}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - coreerp-network

  usuarios-api:
    build:
      context: .
      dockerfile: UsuariosAPI/Dockerfile
    container_name: coreerp-usuarios-api
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    command: ["/app/wait-for-it.sh", "sqlserver:1433", "--timeout=60", "--strict", "--", "dotnet", "UsuariosAPI.dll"]
    ports:
      - "5184:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DB_CONNECTION_STRING=Server=sqlserver,1433;Database=CoreERP_UsuariosDB;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Password123*!};TrustServerCertificate=True;MultipleActiveResultSets=true
      - JWT_KEY=${JWT_KEY:-CoreERP_SuperSecret_Jwt_Key_2026_Min256BitsLong!}
      - JWT_ISSUER=${JWT_ISSUER:-CoreERP}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-CoreERPClient}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-AdminStrongPassword123*!}
    networks:
      - coreerp-network

volumes:
  sqlserver_data:
    driver: local

networks:
  coreerp-network:
    driver: bridge
